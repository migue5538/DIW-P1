<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Configuración</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="topbar">
    <a class="mi-logo" href="lobby.html">AuraPlay</a>
    <div class="user-box">
      <span>Aura: 1.000</span>
      <div class="avatar-circulo" aria-label="Avatar de usuario">J</div>
    </div>
  </header>

  <nav class="menu-navegacion" aria-label="Navegación principal">
    <a class="nav-btn" href="lobby.html">Lobby</a>
    <a class="nav-btn" href="tienda.html">Tienda</a>
    <a class="nav-btn" href="personaje.html">Personaje</a>
    <a class="nav-btn activo" href="configuracion.html">Configuración</a>
  </nav>

  <main class="contenedor-principal">
    <h1>Configuración</h1>

    <section class="caja-ajuste">
      <h2>Apodo</h2>
      <form action="configuracion.html" method="get">
        <label for="apodo-cfg">Apodo actual</label>
        <input class="campo-texto" id="apodo-cfg" name="apodo" type="text" value="Jugador" minlength="3" maxlength="16" required>
        <button class="btn-azul" type="submit">Guardar apodo</button>
      </form>
    </section>

    <section class="caja-ajuste">
      <h2>Sonido</h2>
      <form action="configuracion.html" method="get">
        <fieldset class="grupo-opciones">
          <legend>Efectos de sonido</legend>
          <label><input type="radio" name="sonido" value="si" checked> Sí</label>
          <label><input type="radio" name="sonido" value="no"> No</label>
        </fieldset>
        <button class="btn-azul" type="submit">Guardar ajustes</button>
      </form>
    </section>

    <section class="caja-ajuste caja-alerta">
      <h2>Sesión y cuenta</h2>
      <div class="grupo-botones">
        <a class="btn-info" href="index.html">Cerrar sesión</a>
        <a class="btn-rojo" href="index.html">Eliminar cuenta</a>
      </div>
    </section>
  </main>
</body>
</html>
