<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Tienda</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="barra-superior">
    <a class="barra-superior__logo" href="lobby.html">AuraPlay</a>
    <div class="barra-superior__usuario">
      <span>Aura: 1.000</span>
      <span class="barra-superior__avatar">J</span>
    </div>
  </header>

  <nav class="navegacion">
    <a class="navegacion__enlace" href="lobby.html">Lobby</a>
    <a class="navegacion__enlace navegacion__enlace--activo" href="tienda.html">Tienda</a>
    <a class="navegacion__enlace" href="personaje.html">Personaje</a>
    <a class="navegacion__enlace" href="configuracion.html">Configuración</a>
  </nav>

  <main class="pagina__contenido">
    <h1>Tienda</h1>
    <p>Usa tu aura para personalizar tu personaje.</p>
    <div class="tienda__lista">
      <div class="articulo">
        <div class="articulo__vista">Cabeza</div>
        <h2>Gorra de explorador</h2>
        <p>Nivel 1</p>
        <p>150 aura</p>
        <button class="boton boton--principal" type="button">Comprar</button>
      </div>
      <div class="articulo">
        <div class="articulo__vista">Cuerpo</div>
        <h2>Sudadera violeta</h2>
        <p>Nivel 2</p>
        <p>300 aura</p>
        <button class="boton boton--principal" type="button">Comprar</button>
      </div>
      <div class="articulo">
        <div class="articulo__vista">Calzado</div>
        <h2>Zapatillas nube</h2>
        <p>Nivel 3</p>
        <p>450 aura</p>
        <button class="boton boton--principal" type="button">Comprar</button>
      </div>
      <div class="articulo">
        <div class="articulo__vista">Accesorio</div>
        <h2>Mochila estelar</h2>
        <p>Nivel 4</p>
        <p>600 aura</p>
        <button class="boton boton--principal" type="button">Comprar</button>
      </div>
    </div>
  </main>
</body>
</html>
