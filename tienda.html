<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Tienda</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="topbar">
    <a class="mi-logo" href="lobby.html">AuraPlay</a>
    <div class="user-box">
      <span>Aura: 1.000</span>
      <div class="avatar-circulo" aria-label="Avatar de usuario">J</div>
    </div>
  </header>

  <nav class="menu-navegacion" aria-label="Navegación principal">
    <a class="nav-btn" href="lobby.html">Lobby</a>
    <a class="nav-btn activo" href="tienda.html">Tienda</a>
    <a class="nav-btn" href="personaje.html">Personaje</a>
    <a class="nav-btn" href="configuracion.html">Configuración</a>
  </nav>

  <main class="contenedor-principal">
    <section>
      <h1>Tienda</h1>
      <p>Usa tu aura para personalizar tu personaje.</p>
      <div class="grid-tienda">
        <article class="card-item">
          <div class="preview-item">Cabeza</div>
          <h2>Gorra de explorador</h2>
          <p>Nivel 1</p>
          <p>150 aura</p>
          <button class="btn-azul" type="button">Comprar</button>
        </article>
        <article class="card-item">
          <div class="preview-item">Cuerpo</div>
          <h2>Sudadera violeta</h2>
          <p>Nivel 2</p>
          <p>300 aura</p>
          <button class="btn-azul" type="button">Comprar</button>
        </article>
        <article class="card-item">
          <div class="preview-item">Calzado</div>
          <h2>Zapatillas nube</h2>
          <p>Nivel 3</p>
          <p>450 aura</p>
          <button class="btn-azul" type="button">Comprar</button>
        </article>
        <article class="card-item">
          <div class="preview-item">Accesorio</div>
          <h2>Mochila estelar</h2>
          <p>Nivel 4</p>
          <p>600 aura</p>
          <button class="btn-azul" type="button">Comprar</button>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
