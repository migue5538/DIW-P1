<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Elige tu apodo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="bienvenida">
    <a class="bienvenida__logo" href="index.html">AuraPlay</a>
  </header>

  <main class="registro__panel">
    <h1>Elige tu apodo</h1>
    <p class="registro__aviso">Al crear tu cuenta recibirás 1.000 de aura.</p>
    <form class="formulario" action="lobby.html" method="post">
      <label for="apodo">Apodo</label>
      <input class="formulario__campo" id="apodo" name="apodo" type="text" minlength="3" maxlength="16" required>
      <button class="boton boton--principal" type="submit">Continuar</button>
    </form>
  </main>
</body>
</html>
