<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Elige tu apodo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="cabecera-inicio">
    <a class="mi-logo" href="index.html">AuraPlay</a>
  </header>

  <main class="caja-formulario">
    <h1>Elige tu apodo</h1>
    <div class="aviso-azul">Al crear tu cuenta recibirás 1.000 de aura.</div>
    <form action="lobby.html" method="get">
      <label for="apodo">Apodo</label>
      <input class="campo-texto" id="apodo" name="apodo" type="text" minlength="3" maxlength="16" placeholder="Tu apodo" required>
      <button class="btn-azul" type="submit">Continuar</button>
    </form>
  </main>
</body>
</html>
