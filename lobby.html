<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Lobby</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="topbar">
    <a class="mi-logo" href="lobby.html">AuraPlay</a>
    <div class="user-box">
      <span>Aura: 1.000</span>
      <div class="avatar-circulo" aria-label="Avatar de usuario">J</div>
    </div>
  </header>

  <nav class="menu-navegacion" aria-label="Navegación principal">
    <a class="nav-btn activo" href="lobby.html">Lobby</a>
    <a class="nav-btn" href="tienda.html">Tienda</a>
    <a class="nav-btn" href="personaje.html">Personaje</a>
    <a class="nav-btn" href="configuracion.html">Configuración</a>
  </nav>

  <main class="contenedor-principal">
    <section class="caja-perfil">
      <div class="caja-avatar">Personaje</div>
      <div>
        <h1>Hola, Jugador</h1>
        <p>Elige un reto y consigue más aura.</p>
        <button class="btn-normal" type="button">Reclamar bonus diario: 100 aura</button>
      </div>
    </section>

    <section>
      <h2>Minijuegos</h2>
      <div class="grid-juegos">
        <article class="card-juego">
          <h3>Memoria visual</h3>
          <p>Encuentra todas las parejas antes de que se acabe el tiempo.</p>
          <button class="btn-azul" type="button">Jugar</button>
        </article>
        <article class="card-juego bloqueado">
          <h3>Preguntas relámpago</h3>
          <p>Próximamente</p>
          <button class="btn-normal" type="button" disabled>Próximamente</button>
        </article>
        <article class="card-juego bloqueado">
          <h3>Salto de nubes</h3>
          <p>Próximamente</p>
          <button class="btn-normal" type="button" disabled>Próximamente</button>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
