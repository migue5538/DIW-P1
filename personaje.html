<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraPlay | Personaje</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina">
  <header class="topbar">
    <a class="mi-logo" href="lobby.html">AuraPlay</a>
    <div class="user-box">
      <span>Aura: 1.000</span>
      <div class="avatar-circulo" aria-label="Avatar de usuario">J</div>
    </div>
  </header>

  <nav class="menu-navegacion" aria-label="Navegación principal">
    <a class="nav-btn" href="lobby.html">Lobby</a>
    <a class="nav-btn" href="tienda.html">Tienda</a>
    <a class="nav-btn activo" href="personaje.html">Personaje</a>
    <a class="nav-btn" href="configuracion.html">Configuración</a>
  </nav>

  <main class="contenedor-principal">
    <section class="caja-personaje-actual">
      <h1>Tu personaje</h1>
      <div class="preview-item">Personaje actual</div>
      <p>Aspecto equipado: <strong>Clásico</strong></p>
    </section>

    <section>
      <h2>Artículos comprados</h2>
      <div class="grid-inventario">
        <article class="card-item">
          <h3>Gorra de explorador</h3>
          <p>Equipado</p>
          <button class="btn-normal" type="button" disabled>Equipado</button>
        </article>
        <article class="card-item">
          <h3>Sudadera violeta</h3>
          <p>Disponible</p>
          <button class="btn-azul" type="button">Equipar</button>
        </article>
        <article class="card-item">
          <h3>Zapatillas nube</h3>
          <p>Disponible</p>
          <button class="btn-azul" type="button">Equipar</button>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
